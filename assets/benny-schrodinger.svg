<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Benny as Schrödinger's cat</title>
  <desc id="desc">Cartoon of Benny, a fluffy black cat with yellow-green eyes, peeking out of a cardboard box next to a dashed, translucent sleeping copy of himself: awake and asleep at the same time until the box is opened.</desc>

  <style>
    .fur { fill: #1f1a19; stroke: #3d302b; stroke-width: 1.5; stroke-linejoin: round; }
    .ear-in { fill: #6b4430; }
    .eye { fill: #c8d64a; }
    .pupil { fill: #0d0b0b; }
    .nose { fill: #7a5f5a; }
    .mouth { fill: none; stroke: #bfb2ab; stroke-width: 2; stroke-linecap: round; }
    .whisker { stroke: #d9d2cc; stroke-width: 1; stroke-linecap: round; }
    .ghost path, .ghost ellipse { fill: none; stroke: #9a6744; stroke-width: 1.6; stroke-dasharray: 4 3; stroke-linecap: round; }
    .label { font-family: ui-monospace, Menlo, Consolas, monospace; fill: #3b2a17; }
    .caption { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6d6480; font-size: 13px; }
  </style>

  <rect x="0" y="0" width="400" height="320" rx="24" fill="#fff8ec"/>

  <!-- quantum state -->
  <text x="200" y="34" text-anchor="middle" class="label" font-size="18" font-weight="700">ψ = |awake⟩ + |asleep⟩</text>

  <!-- box interior and back flaps (behind Benny) -->
  <polygon points="70,190 100,168 300,168 330,190" fill="#8c6436"/>
  <polygon points="70,190 28,160 62,146 100,168" fill="#c89a62" stroke="#a37a45" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="330,190 372,160 338,146 300,168" fill="#c89a62" stroke="#a37a45" stroke-width="2" stroke-linejoin="round"/>

  <!-- asleep Benny: dashed, translucent superposition copy -->
  <g class="ghost" opacity="0.75" transform="translate(222 72) scale(1.3)">
    <path d="M18 44 L20 8 L46 26Z"/>
    <path d="M82 44 L80 8 L54 26Z"/>
    <path d="M50 20 C72 20 86 34 86 52 L93 57 L85 61 L90 69 L79 71 C73 80 62 86 50 86 C38 86 27 80 21 71 L10 69 L15 61 L7 57 L14 52 C14 34 28 20 50 20Z"/>
    <path d="M30 50 Q37 55 44 50 M56 50 Q63 55 70 50"/>
    <path d="M46.5 60 L53.5 60 L50 64.5Z"/>
    <path d="M45 68 Q50 70 55 68"/>
  </g>
  <text x="344" y="80" class="label" font-size="18" fill-opacity="0.6">z</text>
  <text x="358" y="64" class="label" font-size="14" fill-opacity="0.5">z</text>
  <text x="369" y="51" class="label" font-size="11" fill-opacity="0.4">z</text>

  <!-- awake Benny -->
  <g transform="translate(75 54) scale(1.7)">
    <path class="fur" d="M18 44 L20 8 L46 26Z"/>
    <path class="fur" d="M82 44 L80 8 L54 26Z"/>
    <path class="ear-in" d="M24 32 L25 16 L38 26Z"/>
    <path class="ear-in" d="M76 32 L75 16 L62 26Z"/>
    <path class="fur" d="M50 20 C72 20 86 34 86 52 L93 57 L85 61 L90 69 L79 71 C73 80 62 86 50 86 C38 86 27 80 21 71 L10 69 L15 61 L7 57 L14 52 C14 34 28 20 50 20Z"/>
    <ellipse class="eye" cx="37" cy="50" rx="7.5" ry="6.5"/>
    <ellipse class="eye" cx="63" cy="50" rx="7.5" ry="6.5"/>
    <ellipse class="pupil" cx="38" cy="50" rx="2" ry="5.5"/>
    <ellipse class="pupil" cx="64" cy="50" rx="2" ry="5.5"/>
    <circle cx="40" cy="47" r="1.3" fill="#fff"/>
    <circle cx="66" cy="47" r="1.3" fill="#fff"/>
    <path class="nose" d="M46.5 60 L53.5 60 L50 64.5Z"/>
    <path class="mouth" d="M44 67 Q47 70.5 50 67 Q53 70.5 56 67"/>
    <path class="whisker" d="M30 62 L4 58 M30 65 L5 66 M70 62 L96 58 M70 65 L95 66"/>
  </g>

  <!-- box front -->
  <rect x="70" y="190" width="260" height="96" rx="4" fill="#d8b07a" stroke="#a37a45" stroke-width="2"/>
  <line x1="200" y1="190" x2="200" y2="286" stroke="#a37a45" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- paws over the edge -->
  <ellipse cx="128" cy="192" rx="17" ry="10" fill="#1f1a19" stroke="#3d302b" stroke-width="1.5"/>
  <ellipse cx="188" cy="192" rx="17" ry="10" fill="#1f1a19" stroke="#3d302b" stroke-width="1.5"/>
  <ellipse cx="296" cy="192" rx="17" ry="10" fill="none" stroke="#9a6744" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- box labels -->
  <text x="135" y="250" text-anchor="middle" class="label" font-size="40" font-weight="800">50%</text>
  <text x="265" y="250" text-anchor="middle" class="label" font-size="40" font-weight="800" fill-opacity="0.55">50%</text>
  <text x="200" y="276" text-anchor="middle" class="label" font-size="11" letter-spacing="1">CONTAINS ONE (1) CAT · PROBABLY</text>

  <text x="200" y="308" text-anchor="middle" class="caption">Benny stays both awake and asleep until you open the box.</text>
</svg>
